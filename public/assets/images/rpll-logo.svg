<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="100%" height="100%" fill="none">
  <defs>
    <style>
      .rpll-brand-text { fill: currentColor; }
      .rpll-sub-text   { fill: var(--text-muted, #94A3B8); }
      @media (prefers-color-scheme: light) {
        .rpll-brand-text { fill: #0f172a; }
        .rpll-sub-text   { fill: #475569; }
      }
    </style>
    <linearGradient id="rpll-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0072FF" />
    </linearGradient>
    <linearGradient id="rpll-shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#00E5FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0A2540" stop-opacity="0.95" />
    </linearGradient>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ISOTYPE: Shield + Circuit + Hex Mesh -->
  <g transform="translate(10, 10)">
    <polygon points="60,4 108,24 108,76 60,116 12,76 12,24"
             fill="#07111E" stroke="url(#rpll-primary)" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M 60,16 L 96,32 C 96,68 60,98 60,98 C 60,98 24,68 24,32 Z"
          fill="url(#rpll-shield)" stroke="#00E5FF" stroke-width="1.5" stroke-opacity="0.8" />
    <!-- PCB Traces -->
    <path d="M 40,48 L 52,48 L 60,56 L 60,78" stroke="#00E5FF" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 80,48 L 68,48 L 60,56"         stroke="#00E5FF" stroke-width="2" stroke-linecap="round" fill="none" />
    <circle cx="40" cy="48" r="3" fill="#00E5FF" filter="url(#glow-cyan)" />
    <circle cx="80" cy="48" r="3" fill="#00E5FF" filter="url(#glow-cyan)" />
    <circle cx="60" cy="78" r="3" fill="#00E5FF" filter="url(#glow-cyan)" />
    <!-- Security Core -->
    <polygon points="60,46 68,52 68,64 60,70 52,64 52,52" fill="#00E5FF" />
    <!-- Node Cluster -->
    <circle cx="98" cy="18" r="2.5" fill="#38BDF8" />
    <line x1="98" y1="18" x2="108" y2="24" stroke="#38BDF8" stroke-width="1" stroke-dasharray="2 2" />
    <circle cx="112" cy="12" r="2" fill="#00E5FF" />
    <line x1="98" y1="18" x2="112" y2="12" stroke="#00E5FF" stroke-width="1" />
  </g>

  <!-- WORDMARK: RPLL + Subtitle -->
  <g transform="translate(145, 20)">
    <text x="0" y="56" class="rpll-brand-text"
          font-family="'Space Grotesk', 'Segoe UI', system-ui, sans-serif"
          font-weight="900" font-size="54" letter-spacing="3">
      RP<tspan fill="url(#rpll-primary)">LL</tspan>
    </text>
    <!-- Circuit accent -->
    <circle cx="168" cy="22" r="3.5" fill="#00E5FF" filter="url(#glow-cyan)" />
    <line x1="168" y1="22" x2="185" y2="22" stroke="#00E5FF" stroke-width="1.5" />
    <circle cx="185" cy="22" r="2" fill="#00E5FF" />
    <!-- Subtitle -->
    <text x="2" y="84" class="rpll-sub-text"
          font-family="'JetBrains Mono', 'Segoe UI Mono', monospace"
          font-weight="700" font-size="13.5" letter-spacing="4.5">
      INGENIERÍA <tspan fill="#00E5FF">|</tspan> CIBERSEGURIDAD
    </text>
    <line x1="2" y1="96" x2="350" y2="96" stroke="rgba(0, 229, 255, 0.25)" stroke-width="1" />
    <rect x="2" y="95" width="40" height="2" fill="#00E5FF" />
  </g>
</svg>

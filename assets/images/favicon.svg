<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="fav-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0052CC" />
    </linearGradient>
    <linearGradient id="fav-shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2540" />
      <stop offset="100%" stop-color="#050E17" />
    </linearGradient>
  </defs>
  
  <!-- Hexagon Outer Frame -->
  <polygon points="64,6 116,28 116,84 64,122 12,84 12,28" 
           fill="#050B14" stroke="url(#fav-grad)" stroke-width="5" stroke-linejoin="round" />
           
  <!-- Shield -->
  <path d="M 64,20 L 102,36 C 102,74 64,104 64,104 C 64,104 26,74 26,36 Z" 
        fill="url(#fav-shield)" stroke="#00E5FF" stroke-width="3" />
        
  <!-- Circuit PCB Traces -->
  <path d="M 44,52 L 56,52 L 64,60 L 64,82" stroke="#00E5FF" stroke-width="3.5" stroke-linecap="round" fill="none" />
  <path d="M 84,52 L 72,52 L 64,60" stroke="#00E5FF" stroke-width="3.5" stroke-linecap="round" fill="none" />
  <circle cx="44" cy="52" r="4.5" fill="#00E5FF" />
  <circle cx="84" cy="52" r="4.5" fill="#00E5FF" />
  <circle cx="64" cy="82" r="4.5" fill="#00E5FF" />
  
  <!-- Center Core -->
  <polygon points="64,48 74,55 74,67 64,74 54,67 54,55" fill="#00E5FF" />
</svg>

name: Deploy academy from private source

on:
  repository_dispatch:
    types: [academy-content-reviewed]
  workflow_dispatch:
    inputs:
      courses_ref:
        description: SHA or branch from leafar1087/cursos
        required: true
        default: main

permissions:
  contents: read
  deployments: write

concurrency:
  group: academy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      COURSES_REPOSITORY: leafar1087/cursos
      COURSES_REF: ${{ github.event.client_payload.courses_ref || inputs.courses_ref || 'main' }}
    steps:
      - name: Checkout portfolio application
        uses: actions/checkout@v4

      - name: Checkout reviewed private courses
        uses: actions/checkout@v4
        with:
          repository: ${{ env.COURSES_REPOSITORY }}
          ref: ${{ env.COURSES_REF }}
          token: ${{ secrets.COURSES_READ_TOKEN }}
          path: .courses-source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build academy from the immutable course revision
        run: |
          rm -rf posts/academy
          mkdir -p posts/academy
          python3 .courses-source/tools/export_portfolio_content.py \
            --root .courses-source/products/portfolio/courses \
            --output posts/academy
          python3 -m unittest discover -s tests -v
          python3 build_index.py
          node --check js/academy-loader.js
          ! find public -type f \( -name '*.py' -o -name '*.pyc' -o -name '.env' -o -name '.env.*' \) -print -quit | grep -q .
          ! find public -type d -name '__pycache__' -print -quit | grep -q .
          ! rg -n 'artifact_id|source_path|knowledge_dependencies|source_dependencies|Control de cambios|Registro interno|K-[A-Z0-9]' posts/academy public/posts/academy

      - name: Deploy static assets to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

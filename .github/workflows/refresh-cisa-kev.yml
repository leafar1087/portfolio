name: Refresh CISA KEV snapshot

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cisa-kev-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Require the scoped PR token
        env:
          KEV_UPDATE_TOKEN: ${{ secrets.KEV_UPDATE_TOKEN }}
        run: test -n "$KEV_UPDATE_TOKEN"
      - name: Refresh the local catalog
        run: |
          remote_branch="$(git ls-remote --heads origin automation/cisa-kev)"
          if [ -n "$remote_branch" ]; then
            git fetch origin +refs/heads/automation/cisa-kev:refs/remotes/origin/automation/cisa-kev
          fi
          git switch -C automation/cisa-kev
          python3 tools/update_kev_catalog.py
          if git diff --quiet -- data/cisa-kev.json; then
            echo "CISA KEV has no new catalog version."
            exit 0
          fi
          python3 build_index.py
          python3 -m unittest discover -s tests -v
          python3 tools/build_css.py --check
          node --check js/tools.js
          git diff --check
      - name: Create or refresh the review PR
        env:
          GH_TOKEN: ${{ secrets.KEV_UPDATE_TOKEN }}
          KEV_UPDATE_TOKEN: ${{ secrets.KEV_UPDATE_TOKEN }}
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cisa-kev.json public/data/cisa-kev.json sitemap.xml public/sitemap.xml
          git commit -m "chore(data): refresh CISA KEV snapshot"
          git remote set-url origin "https://x-access-token:${KEV_UPDATE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force-with-lease origin HEAD:automation/cisa-kev
          pr_number="$(gh pr list --head automation/cisa-kev --base main --state open --json number --jq '.[0].number')"
          body="Actualización automática del snapshot local CISA KEV. Validada con tests, build estático, CSS y sintaxis de herramientas. Revisar la versión y fusionar mediante el flujo protegido de main."
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --body "$body"
          else
            gh pr create --base main --head automation/cisa-kev --title "chore(data): refresh CISA KEV snapshot" --body "$body"
          fi

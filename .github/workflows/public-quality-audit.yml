name: Public quality audit

on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install matching Chrome and driver
        shell: bash
        run: |
          npx --yes browser-driver-manager@2.0.1 install chrome > driver.env
          chrome_path="$(find "$HOME/.browser-driver-manager" -type f -name chrome -print -quit)"
          chromedriver_path="$(find "$HOME/.browser-driver-manager" -type f -name chromedriver -print -quit)"
          test -x "$chrome_path"
          test -x "$chromedriver_path"
          printf 'CHROME_TEST_PATH=%s\n' "$chrome_path" >> "$GITHUB_ENV"
          printf 'CHROMEDRIVER_TEST_PATH=%s\n' "$chromedriver_path" >> "$GITHUB_ENV"

      - name: Run axe WCAG audit
        shell: bash
        run: |
          npx --yes @axe-core/cli@4.10.2 \
            https://rafaelperezllorca.com/index.html \
            https://rafaelperezllorca.com/pages/academy.html \
            https://rafaelperezllorca.com/pages/article.html \
            https://rafaelperezllorca.com/pages/tools.html \
            --tags wcag2a,wcag2aa \
            --disable meta-refresh \
            --load-delay 1500 \
            --chromedriver-path "$CHROMEDRIVER_TEST_PATH" \
            --chrome-path "$CHROME_TEST_PATH" \
            --exit

      - name: Run Lighthouse audits
        shell: bash
        run: |
          python3 -m http.server 4173 --directory . >/tmp/portfolio-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          mkdir -p audit-results
          for page in index academy article tools; do
            if [ "$page" = "index" ]; then
              url="http://127.0.0.1:4173/index.html"
            else
              url="http://127.0.0.1:4173/pages/${page}.html"
            fi
            npx --yes lighthouse@12.6.1 "$url" \
              --only-categories=accessibility,performance,seo \
              --output=json \
              --output-path="audit-results/${page}.json" \
              --preset=desktop \
              --chrome-flags="--headless --no-sandbox" \
              --quiet
            jq -e '
              .categories.accessibility.score >= 0.95 and
              .categories.performance.score >= 0.90 and
              .categories.seo.score >= 0.95
            ' "audit-results/${page}.json" >/dev/null
            jq -r '[.requestedUrl, (.categories|to_entries[]|"\(.key)=\(.value.score*100|round)")] | @tsv' "audit-results/${page}.json"
          done

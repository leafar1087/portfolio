name: Static content build

on:
  push: {}
  pull_request: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5; SHA fijado para pinning obligatorio
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 tools/build_css.py --check
      - run: node --input-type=module --check < functions/api/attack.js
      - run: python3 build_index.py
      - name: Render public analytics configuration
        env:
          GOOGLE_ANALYTICS_MEASUREMENT_ID: ${{ secrets.GOOGLE_ANALYTICS_MEASUREMENT_ID }}
        run: |
          if [ -n "${GOOGLE_ANALYTICS_MEASUREMENT_ID:-}" ]; then
            if [[ ! "$GOOGLE_ANALYTICS_MEASUREMENT_ID" =~ ^G-[A-Z0-9]+$ ]]; then
              echo "GOOGLE_ANALYTICS_MEASUREMENT_ID tiene un formato inválido." >&2
              exit 1
            fi
            printf "window.PORTFOLIO_GA_MEASUREMENT_ID = '%s';\n" "$GOOGLE_ANALYTICS_MEASUREMENT_ID" > public/js/analytics-config.js
          fi
      - run: |
          test -d public
          ! find public -type f \( -name '*.py' -o -name '*.pyc' -o -name '.env' -o -name '.env.*' \) -print -quit | grep -q .
          ! find public -type d -name '__pycache__' -print -quit | grep -q .

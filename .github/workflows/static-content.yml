name: Static content build

on:
  push:
    paths:
      - 'posts/**'
      - 'build_index.py'
      - 'pages/**'
      - 'js/**'
      - 'css/**'
      - '_headers'
      - '_redirects'
      - '.github/workflows/static-content.yml'
  pull_request:
    paths:
      - 'posts/**'
      - 'build_index.py'
      - 'pages/**'
      - 'js/**'
      - 'css/**'
      - '_headers'
      - '_redirects'
      - '.github/workflows/static-content.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5; SHA fijado para pinning obligatorio
        with:
          python-version: '3.x'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 tools/build_css.py --check
      - run: node --input-type=module --check < functions/api/attack.js
      - run: python3 build_index.py
      - run: |
          test -d public
          ! find public -type f \( -name '*.py' -o -name '*.pyc' -o -name '.env' -o -name '.env.*' \) -print -quit | grep -q .
          ! find public -type d -name '__pycache__' -print -quit | grep -q .
